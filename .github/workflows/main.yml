name: CI/CD workflow

env:
  SERVER_IP: "137.74.174.195"
  SERVER_USER: root
on:
  push:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: checkout le code
        uses: actions/checkout@v4
      - name: installer node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json
      - name: install dependencies
        run: npm ci --cache .npm --prefer-offline
      - name: execute les tests
        run: npm run test:ci
      - name: verifie le code 
        run: npm run lint 
      - name: verfie les vulnerabilites des dependences
        run: npm audit
        continue-on-error: true 
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout le code
        uses: actions/checkout@v4
      - name: deployer sur le serveur
        run: |
          eval "$(ssh-agent -s)"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY_VPS }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-add ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          scp -r ./server "$SERVER_USER@$SERVER_IP:/var/www"
          ssh "$SERVER_USER@$SERVER_IP" "cd /var/www/server && npm install --omit=dev"
          ssh "$SERVER_USER@$SERVER_IP" "cd /var/www/server && pm2 startOrRestart ecosystem.config.js --env production && pm2 save"

