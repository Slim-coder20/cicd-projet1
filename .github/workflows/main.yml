# Nom affiché dans l'onglet Actions de GitHub
name: CI/CD workflow

# Variables d'environnement disponibles dans tous les jobs
env:
  SERVER_IP: "137.74.174.195" # Adresse IP du VPS de production
  SERVER_USER: root           # Utilisateur SSH utilisé pour le déploiement

# Quand ce workflow se déclenche
on:
  push:
    branches:
      - main # Uniquement quand on pousse sur la branche main

jobs:
  # ------------------------------------------------------------------
  # Job 1 : tests — vérifie le backend avant de déployer
  # ------------------------------------------------------------------
  check-tests-backend:
    runs-on: ubuntu-latest # Machine virtuelle Ubuntu fournie par GitHub
    defaults:
      run:
        # Toutes les commandes "run" de ce job s'exécutent dans ./server
        working-directory: ./server
    steps:
      # Récupère le code du dépôt sur le runner GitHub
      - name: checkout le code
        uses: actions/checkout@v4

      # Installe Node.js 20 et met en cache les paquets npm
      - name: installer node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'                         # Version de Node utilisée en CI
          cache: 'npm'                               # Cache npm pour accélérer les prochains runs
          cache-dependency-path: ./server/package-lock.json # Fichier qui sert de clé au cache

      # Installe les dépendances de façon reproductible (d'après package-lock.json)
      - name: install dependencies
        run: npm ci --prefer-offline

      # Lance les tests Jest en mode CI (avec coverage)
      - name: execute les tests
        run: npm run test:ci

      # Envoie le rapport de coverage vers Codecov
      # defaults.run.working-directory ne s'applique PAS aux actions "uses"
      # donc on pointe explicitement vers les fichiers générés dans ./server/coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./server/coverage/lcov.info,./server/coverage/cobertura-coverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: backend
          slug: Slim-coder20/cicd-projet1

      # Vérifie le style et les erreurs de code avec ESLint
      - name: verifie le code
        run: npm run lint

      # Analyse les failles connues dans les dépendances npm
      # continue-on-error: l'étape peut échouer sans bloquer le job (donc le deploy)
      - name: verfie les vulnerabilites des dependences
        run: npm audit
        continue-on-error: true
  # ------------------------------------------------------------------
  # Job 2 : tests — vérifie le frontend avant de déployer
  # ------------------------------------------------------------------
  check-frontend:
    runs-on: ubuntu-latest # Machine virtuelle Ubuntu fournie par GitHub
    defaults:
      run:
        # Toutes les commandes "run" de ce job s'exécutent dans ./client
        working-directory: ./client
    steps:
      # Récupère le code du dépôt sur le runner GitHub
      - name: checkout le code
        uses: actions/checkout@v4

      # Installe Node.js 20 et met en cache les paquets npm
      - name: installer node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'                         # Version de Node utilisée en CI
          cache: 'npm'                               # Cache npm pour accélérer les prochains runs
          cache-dependency-path: ./client/package-lock.json # Fichier qui sert de clé au cache

      # Installe les dépendances de façon reproductible (d'après package-lock.json)
      - name: install dependencies
        run: npm ci --prefer-offline
      # Vérifie le style et les erreurs de code avec ESLint
      - name: verifie le code
        run: npm run lint
      # Analyse les failles connues dans les dépendances npm
      # continue-on-error: l'étape peut échouer sans bloquer le job (donc le deploy)
      - name: verfie les vulnerabilites des dependences
        run: npm audit
        continue-on-error: true

  # ------------------------------------------------------------------
  # Job 3 : build — compile le frontend Vue/Vite pour la production
  # ------------------------------------------------------------------
  build-frontend:
    needs: check-frontend          # Ne démarre que si le lint/audit frontend a réussi
    runs-on: ubuntu-latest
    defaults:
      run:
        # Toutes les commandes "run" de ce job s'exécutent dans ./client
        working-directory: ./client
    steps:
      # Le runner de build est une autre machine : il faut re-récupérer le code
      - name: checkout le code
        uses: actions/checkout@v4

      # Installe Node.js 20 et met en cache les paquets npm
      - name: installer node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'                         # Version de Node utilisée en CI
          cache: 'npm'                               # Cache npm pour accélérer les prochains runs
          cache-dependency-path: ./client/package-lock.json # Fichier qui sert de clé au cache

      # Installe les dépendances de façon reproductible (d'après package-lock.json)
      - name: install dependencies
        run: npm ci --prefer-offline

      # Compile le frontend (type-check + vite build)
      - name: build application frontend
        run: npm run build
      # utiliser un artifact 
      - name: upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: build 
          path: ./client/dist
  # ------------------------------------------------------------------
  # Job 4 : Test E2E Frontend 
  # ------------------------------------------------------------------
  test-e2e-frontend:
    needs: build-frontend        # Ne démarre que si le build frontend a réussi
    runs-on: ubuntu-latest
    steps:
      # Le runner de build est une autre machine : il faut re-récupérer le code
      - name: checkout le code
        uses: actions/checkout@v4

      # Installe Node.js 20 et met en cache les paquets npm
      - name: installer node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'                         # Version de Node utilisée en CI
          cache: 'npm'                               # Cache npm pour accélérer les prochains runs
          cache-dependency-path: '**package-lock.json' # Récupérer dans tous les dossiers et sous dossisers le package-lock.json

      # Installe les dépendances de façon reproductible (d'après package-lock.json)
      - name: install dependencies
        run: |
          cd server 
          npm ci --prefer-offline

      # utiliser un artifact 
      - name: download build artefact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./client/dist
      - name: start-backend
        run: |
          cd server 
          npm start
      - name: exec cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./client
          browser: chrome
          start: npm run preview
          wait-on: http://localhost:4173
          wait-on-timeout: 60
          config: baseUrl=http://localhost:4173

  # ------------------------------------------------------------------
  # Job 5 : deploy — copie le backend sur le VPS et relance l'app
  # ------------------------------------------------------------------
  deploy:
    needs: [check-tests-backend, test-e2e-frontend] # Ne démarre que si backend et frontend ont réussi
    runs-on: ubuntu-latest
    steps:
      # Le runner de deploy est une autre machine : il faut re-récupérer le code
      - name: checkout le code
        uses: actions/checkout@v4
      - name: download build artefact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./dist


      # Connexion SSH au VPS, copie des fichiers, install prod, démarrage PM2
      - name: deployer sur le serveur
        # Démarre l'agent SSH qui va garder la clé privée en mémoire
        # Crée le dossier SSH s'il n'existe pas
        # 700 = seul le propriétaire peut entrer dans ~/.ssh (exigé par SSH)
        # Écrit la clé privée stockée dans le secret GitHub SSH_KEY_VPS
        # 600 = seul le propriétaire peut lire/écrire la clé privée
        # Charge la clé dans l'agent SSH pour scp et ssh
        # Enregistre l'empreinte du VPS pour éviter le prompt "unknown host"
        # Copie le dossier server vers /var/www sur le VPS
        # Installe uniquement les dépendances de production (sans jest, eslint, etc.)
        # Démarre ou redémarre l'app avec PM2 en mode production, puis sauvegarde la config
        run: |
          eval "$(ssh-agent -s)"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY_VPS }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-add ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          scp -r ./server "$SERVER_USER@$SERVER_IP:/var/www"
          scp -r ./dist "$SERVER_USER@$SERVER_IP:/var/www"
          ssh "$SERVER_USER@$SERVER_IP" "cd /var/www/server && npm install --omit=dev"
          ssh "$SERVER_USER@$SERVER_IP" "cd /var/www/server && pm2 startOrRestart ecosystem.config.js --env production && pm2 save"
